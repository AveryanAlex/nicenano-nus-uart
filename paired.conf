# Require LE Secure Connections passkey authentication for NUS access and
# retain bonds for up to eight clients. Change the passkey before deployment.
CONFIG_NUS_UART_PAIRING=y

CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_NUS_AUTHEN=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=8

CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
